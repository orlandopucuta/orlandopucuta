<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laboratório 4</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <a href="../index.html">Voltar ao início</a>
    </header>

    <main>
        <p id="mensagem"
           onmouseover="agradecer()"
           onmouseout="restaurar()">
            1. Passa por aqui!
        </p>

        <p>
            <span id="texto-cor">2. Pinta-me!</span>
            <button onclick="pintar('red')">Red</button>
            <button onclick="pintar('green')">Green</button>
            <button onclick="pintar('blue')">Blue</button>
        </p>

        <p>
            <label for="escrita">3. Experimenta escrever...</label>
            <input id="escrita" type="text" oninput="mudarCorQuadro()">
        </p>

        <p>
            <label for="cor-fundo">4. Escolhe uma cor em inglês:</label>
            <input id="cor-fundo" type="text">
            <button onclick="mudarFundo()">Submeter</button>
        </p>

        <p>
            5. <button onclick="contar()">Conta!</button>
            <span id="contador">0</span>
        </p>
    </main>

    <footer>
        <img id="imagem" src="images/logo.png" alt="Logótipo"
             ondblclick="aumentarImagem()"
             onmousemove="moverNaImagem()">
        <p id="aviso-imagem">
            Move o rato sobre a imagem ou faz duplo clique.
        </p>
    </footer>

    <script src="scripts/main.js"></script>
</body>
</html>
